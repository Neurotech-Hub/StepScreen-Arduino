sentence=UI library for an Adalogger M0-compatible board with a 1.3" SH1106 OLED and EC11 rotary encoder module.
paragraph=Provides board/screen pin maps with sketch-level overrides, screen layout zones (info bar, content area, right-justified action column), debounced buttons, and encoder handling with clearly demarcated sketch-level ISR blocks. Built on the Adafruit SH110X driver.
